        const getSeason = (month) => {
            if (month >= 2 && month <= 4) return "spring";
            if (month >= 5 && month <= 7) return "summer";
            if (month >= 8 && month <= 10) return "autumn";
            return "winter";
        };

        // マイレシピを専用枠に分けるためにグループ化処理をアップデート！
        const getGroupedPool = (pool) => {
            const groups = {
                mine: { label: "📝 自分で登録したマイレシピ", items: [] }, // 一番上に出るように最初に定義！
                spring: { label: "🌸 春の旬", items: [] },
                summer: { label: "☀️ 夏の旬", items: [] },
                autumn: { label: "🍁 秋の味覚", items: [] },
                winter: { label: "❄️ 冬の味覚", items: [] },
                all: { label: "✨ 定番メニュー", items: [] } // マイグループと分離して「定番メニュー」に変更
            };
            pool.forEach(item => {
                if (item.id && item.id.startsWith('my_')) {
                    groups.mine.items.push(item);
                } else if (groups[item.season]) {
                    groups[item.season].items.push(item);
                }
            });
            return groups;
        };

        const formatDate = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const getWeeksOfMonth = (year, month) => {
            const weeks = [];
            let firstDay = new Date(year, month, 1);
            let currentDay = new Date(firstDay);
            let dayOfWeek = currentDay.getDay();
            let diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            currentDay.setDate(currentDay.getDate() + diffToMonday);
            let lastDay = new Date(year, month + 1, 0);

            while (currentDay <= lastDay) {
                if (currentDay.getDay() === 1) {
                    const week = [];
                    for (let i = 0; i < 5; i++) {
                        let d = new Date(currentDay);
                        d.setDate(d.getDate() + i);
                        week.push(d);
                    }
                    weeks.push(week);
                }
                currentDay.setDate(currentDay.getDate() + 7);
            }
            return weeks;
        };

        function App() {
            const today = new Date();
            const currentYear = today.getFullYear();
            
            const [currentMonth, setCurrentMonth] = useState(today.getMonth());
            const [currentWeekIndex, setCurrentWeekIndex] = useState(0);
            const [servings, setServings] = useState(2);
            const [isShoppingListOpen, setIsShoppingListOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [checkedItems, setCheckedItems] = useState({});
            
            const [appData, setAppData] = useState({});
            const [stockItems, setStockItems] = useState({}); // 在庫データ { itemKey: qty }
            const [myRecipes, setMyRecipes] = useState({ mains: [], subs: [] }); // マイレシピ
            const [newRecipe, setNewRecipe] = useState({ type: 'main', name: '', ingredients: [] }); // 新規作成用

            // 安全に結合するための対策を適用！
            const combinedMains = useMemo(() => {
                const mains = (myRecipes && Array.isArray(myRecipes.mains)) ? myRecipes.mains : [];
                return [...MAIN_POOL, ...mains];
            }, [myRecipes]);

            const combinedSubs = useMemo(() => {
                const subs = (myRecipes && Array.isArray(myRecipes.subs)) ? myRecipes.subs : [];
                return [...SUB_POOL, ...subs];
            }, [myRecipes]);

            useEffect(() => {
                const ls = (key, setter, parser = JSON.parse) => {
                    const data = localStorage.getItem(key);
                    if (data) {
                        try {
                            const parsed = parser(data);
                            // データの破損や型違いを防ぐ安全ロジック
                            if (key === 'obento_my_recipes') {
                                if (!parsed || typeof parsed !== 'object') {
                                    setter({ mains: [], subs: [] });
                                } else {
                                    setter({
                                        mains: Array.isArray(parsed.mains) ? parsed.mains : [],
                                        subs: Array.isArray(parsed.subs) ? parsed.subs : []
                                    });
                                }
                            } else {
                                setter(parsed);
                            }
                        } catch(e) {
                            console.error("データのパースに失敗しました:", e);
                        }
                    }
                };
    
                ls('obento_calendar_data', setAppData);
                ls('obento_servings', (v) => setServings(parseInt(v)));
                ls('obento_stock_items', setStockItems);
                ls('obento_my_recipes', setMyRecipes);

                const weeks = getWeeksOfMonth(currentYear, today.getMonth());
                const todayStr = formatDate(today);
                weeks.forEach((week, idx) => {
                    week.forEach(date => {
                        if (formatDate(date) === todayStr) setCurrentWeekIndex(idx);
                    });
                });
            }, []);

            const saveState = (key, value, setter) => {
                setter(value);
                localStorage.setItem(key, JSON.stringify(value));
            };

            const handleServingsChange = (e) => {
                const val = parseInt(e.target.value);
                setServings(val);
                localStorage.setItem('obento_servings', val.toString());
            };

            const updateIngredient = (dateStr, ingIdx, field, value) => {
                const updated = { ...appData };
                if (updated[dateStr] && updated[dateStr].ingredients[ingIdx]) {
                    updated[dateStr].ingredients[ingIdx][field] = value;
                    saveState('obento_calendar_data', updated, setAppData);
                }
            };

            const addIngredient = (dateStr) => {
                const updated = { ...appData };
                if (!updated[dateStr]) updated[dateStr] = { main: "", sub1: "", sub2: "", ingredients: [] };
                updated[dateStr].ingredients.push({ name: "", qty: 0, unit: "g", category: "other", _source: "manual" });
                saveState('obento_calendar_data', updated, setAppData);
            };

            const deleteIngredient = (dateStr, ingIdx) => {
                const updated = { ...appData };
                if (updated[dateStr]) {
                    updated[dateStr].ingredients.splice(ingIdx, 1);
                    saveState('obento_calendar_data', updated, setAppData);
                }
            };

            // プルダウンから選んだ時の処理（マイレシピも含めて完全に連動するよ！）
            const applyDishToField = (dateStr, field, dishId) => {
                const updated = { ...appData };
                if (!updated[dateStr]) updated[dateStr] = { main: "", sub1: "", sub2: "", ingredients: [] };
                
                // 未選択（クリア）にした場合
                if (!dishId) {
                    updated[dateStr][field] = "";
                    updated[dateStr][field + 'Id'] = "";
                    updated[dateStr].ingredients = (updated[dateStr].ingredients || []).filter(ing => ing._source !== field);
                    saveState('obento_calendar_data', updated, setAppData);
                    return;
                }

                const pool = field === 'main' ? combinedMains : combinedSubs;
                const dish = pool.find(d => d.id === dishId);
                if (!dish) return;

                // 選んだレシピの名前とIDを保存する
                updated[dateStr][field] = dish.name;
                updated[dateStr][field + 'Id'] = dish.id;
                
                const filteredIngredients = (updated[dateStr].ingredients || []).filter(ing => ing._source !== field);
                const newIngredients = dish.ingredients.map(ing => ({ ...ing, _source: field }));

                updated[dateStr].ingredients = [...filteredIngredients, ...newIngredients];
                saveState('obento_calendar_data', updated, setAppData);
            };

            // 自動提案
            const suggestWeeklyBalance = () => {
                const weeks = getWeeksOfMonth(currentYear, currentMonth);
                const activeWeek = weeks[currentWeekIndex];
                if (!activeWeek) return;

                const updated = { ...appData };
                const season = getSeason(currentMonth);
                const validMains = combinedMains.filter(m => (m.season === season || m.season === "all") && !["m_karaage", "m_curry"].includes(m.id));
                const validSubs = combinedSubs.filter(s => (s.season === season || s.season === "all") && !["s_tamago", "s_broccoli", "s_slaw", "s_fukujin"].includes(s.id));
                const shuffledMains = [...validMains].sort(() => 0.5 - Math.random());
                const shuffledSubs1 = [...validSubs].sort(() => 0.5 - Math.random());
                const shuffledSubs2 = [...validSubs].sort(() => 0.5 - Math.random());

                const karaageRecipe = combinedMains.find(r => r.id === "m_karaage");
                const curryRecipe = combinedMains.find(r => r.id === "m_curry");
                const broccoliSub = combinedSubs.find(r => r.id === "s_broccoli");
                const tamagoSub = combinedSubs.find(r => r.id === "s_tamago");
                const slawSub = combinedSubs.find(r => r.id === "s_slaw");
                const fukujinSub = combinedSubs.find(r => r.id === "s_fukujin");

                activeWeek.forEach((date, index) => {
                    const dateStr = formatDate(date);
                    let targetMain, targetSub1, targetSub2;

                    if (index === 3) {
                        targetMain = karaageRecipe; targetSub1 = broccoliSub; targetSub2 = tamagoSub;
                    } else if (index === 4) {
                        targetMain = curryRecipe; targetSub1 = slawSub; targetSub2 = fukujinSub;
                    } else {
                        targetMain = shuffledMains[index % shuffledMains.length];
                        targetSub1 = shuffledSubs1[index % shuffledSubs1.length];
                        targetSub2 = shuffledSubs2[(index + 1) % shuffledSubs2.length];
                    }

                    if (targetMain && targetSub1 && targetSub2) {
                        const newIngredients = [
                            ...targetMain.ingredients.map(ing => ({...ing, _source: 'main'})),
                            ...targetSub1.ingredients.map(ing => ({...ing, _source: 'sub1'})),

                                                            <div className="flex flex-col items-end gap-1">
                                                                {/* 家にある在庫を入力 */}
                                                                <div className="flex items-center space-x-1 text-[10px] text-gray-500">
                                                                    <span>必要: {item.required.toFixed(1).replace(/\.0$/, '')}</span>
                                                                    <span>- 家に:</span>
                                                                    <input 
                                                                        type="number" 
                                                                        min="0"
                                                                        step="0.1"
                                                                        value={stockItems[item.key] || ''} 
                                                                        placeholder="0"
                                                                        onChange={(e) => {
                                                                            const val = parseFloat(e.target.value) || 0;
                                                                            const newStock = {...stockItems, [item.key]: val};
                                                                            setStockItems(newStock);
                                                                            localStorage.setItem('obento_stock_items', JSON.stringify(newStock));
                                                                        }}
                                                                        className="w-10 px-1 py-0.5 text-center border border-amber-200 rounded bg-white text-gray-700 outline-none focus:border-amber-400"
                                                                    />
                                                                </div>
                                                                {/* 実際に買う量 */}
                                                                <div className="text-right">
                                                                    <span className="text-[10px] text-gray-500 mr-1">買う量:</span>
                                                                    <span className={`font-mono font-black text-sm ${buyQty > 0 ? 'text-rose-600' : 'text-gray-400'}`}>
                                                                        {buyQty.toFixed(1).replace(/\.0$/, '')} <span className="text-[9px] font-normal">{item.unit}</span>
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
