    <script>
        // Tailwind CDNが出す定型の注意メッセージだけを抑制する（他の警告・エラーはそのまま出す）
        (function() {
            var originalWarn = console.warn;
            console.warn = function() {
                var msg = Array.prototype.slice.call(arguments).join(' ');
                if (msg.indexOf('cdn.tailwindcss.com should not be used in production') > -1) {
                    return;
                }
                originalWarn.apply(console, arguments);
            };
        })();
    </script>
    <script>
        // CDN読み込み失敗時や実行時エラー発生時に、真っ白な画面のままにせず
        // 何が起きたか分かるメッセージを表示するためのフォールバック処理
        window.__cdnFail = function(name) {
            var root = document.getElementById('root');
            if (root && !root.dataset.mounted) {
                root.innerHTML = '<div style="max-width:420px;margin:80px auto;padding:24px;text-align:center;font-family:sans-serif;color:#92400e;">' +
                    '<div style="font-size:32px;margin-bottom:8px;">⚠️</div>' +
                    '<p style="font-weight:bold;">' + name + ' の読み込みに失敗しました</p>' +
                    '<p style="font-size:13px;color:#78716c;margin-top:8px;">ネットワーク接続を確認して、もう一度開き直してください。</p>' +
                    '</div>';
            }
        };
        window.addEventListener('error', function(e) {
            var root = document.getElementById('root');
            if (root && !root.dataset.mounted) {
                root.innerHTML = '<div style="max-width:420px;margin:60px auto;padding:24px;text-align:left;font-family:monospace;font-size:11px;color:#b91c1c;white-space:pre-wrap;word-break:break-word;">' +
                    '⚠️ エラーが発生しました:\n' + (e.message || e) + '</div>';
            }
        });
        window.addEventListener('unhandledrejection', function(e) {
            var root = document.getElementById('root');
            if (root && !root.dataset.mounted) {
                root.innerHTML = '<div style="max-width:420px;margin:60px auto;padding:24px;text-align:left;font-family:monospace;font-size:11px;color:#b91c1c;white-space:pre-wrap;word-break:break-word;">' +

        });
    </script>
    <script>
        // 通信が不安定な環境でも動くよう、スクリプト読み込みを数回リトライする
        function loadScriptWithRetry(src, maxRetries, delayMs) {
            return new Promise(function(resolve, reject) {
                var attempt = 0;
                function tryLoad() {
                    attempt++;
                    var s = document.createElement('script');
                    s.src = src;
                    s.onload = function() { resolve(); };
                    s.onerror = function() {
                        s.remove();
                        if (attempt <= maxRetries) {
                            setTimeout(tryLoad, delayMs * attempt);
                        } else {
                            reject(new Error(src));
                        }
                    };
                    document.head.appendChild(s);
                }
                tryLoad();
            });
        }

        // Tailwindはスタイル用なので、失敗してもアプリの起動はブロックしない
        loadScriptWithRetry('https://cdn.tailwindcss.com', 2, 800).catch(function() {
            console.error('Tailwind CSSの読み込みに失敗しました（スタイルなしで続行します）');
        });

        // React → ReactDOM の順で読み込みが完了してからアプリ本体を起動する
        loadScriptWithRetry('https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js', 3, 800)
            .then(function() {
                return loadScriptWithRetry('https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js', 3, 800);

                }
            })
            .catch(function(e) {
                var name = ('' + e.message).indexOf('react-dom') > -1 ? 'React DOM' : 'React';
                window.__cdnFail && window.__cdnFail(name);
            });
    </script>

const getSeason = (month) => {
    if (month >= 2 && month <= 4)
        return "spring";
    if (month >= 5 && month <= 7)
        return "summer";
    if (month >= 8 && month <= 10)
        return "autumn";
    return "winter";
};
// マイレシピを専用枠に分けるためにグループ化処理をアップデート！
const getGroupedPool = (pool) => {
    const groups = {
        mine: { label: "📝 自分で登録したマイレシピ", items: [] }, // 一番上に出るように最初に定義！
        spring: { label: "🌸 春の旬", items: [] },
        summer: { label: "☀️ 夏の旬", items: [] },
        autumn: { label: "🍁 秋の味覚", items: [] },
        winter: { label: "❄️ 冬の味覚", items: [] },
        all: { label: "✨ 定番メニュー", items: [] } // マイグループと分離して「定番メニュー」に変更
    };
    pool.forEach(item => {
        if (item.id && item.id.startsWith('my_')) {
            groups.mine.items.push(item);
        }
        else if (groups[item.season]) {
            groups[item.season].items.push(item);
        }
    });
    return groups;
};
const formatDate = (date) => {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
};
const getWeeksOfMonth = (year, month) => {
    const weeks = [];
    let firstDay = new Date(year, month, 1);
    let currentDay = new Date(firstDay);
    let dayOfWeek = currentDay.getDay();
    let diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    currentDay.setDate(currentDay.getDate() + diffToMonday);
    let lastDay = new Date(year, month + 1, 0);
    while (currentDay <= lastDay) {
        if (currentDay.getDay() === 1) {
            const week = [];
            for (let i = 0; i < 5; i++) {
                let d = new Date(currentDay);
                d.setDate(d.getDate() + i);
                week.push(d);
            }
            // バグ修正：対象月の日を1日も含まない週（前月だけの週）は表示しない
            const hasDayInMonth = week.some(d => d.getMonth() === month);
            if (hasDayInMonth)
                weeks.push(week);
        }
        currentDay.setDate(currentDay.getDate() + 7);
    }
    return weeks;
};
